x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated surfaces were found, probed and specified — two OAI-PMH 2.0
    repositories (GDZ, harvesting back to 1998, and eDiss), a IIIF Image API 2.0 level-2 image
    service with Presentation manifests, and the university's own DFN-AAI/eduGAIN SAML identity
    provider. Three further surfaces exist but are not Göttingen contracts and are recorded as
    relationships: GRO.data (Dataverse), the library catalogue (CNAME to GBV/VZG) and the
    self-hosted Stud.IP deployment. There is no central developer portal, no self-service API
    key, no published rate limits and no institution-authored OpenAPI anywhere in the estate;
    every specification here was written by API Evangelist from live probes and is marked
    method: probed. Two limits on this pass are worth naming. First, the
    goettingen-research-online.de hosts (GRO.data and GRO.publications) sit behind a proof-of-work
    bot challenge that answered 403 to every probe including with a browser User-Agent, so their
    REST and OAI surfaces could not be read — live but unreadable, not dead. Second, the SUB
    Göttingen website has been reorganised and its digital-library documentation paths now 30x to
    the library homepage while still answering 200; the two SUB documentation pointers previously
    recorded here were dead in substance and graded live by status code, and both have been
    replaced.
