aid: university-of-gottingen
name: University of Göttingen
x-type: university
x-category: Public Research University
description: >-
  The University of Göttingen (Georg-August-Universität Göttingen) is a public research university
  in Lower Saxony, Germany, founded 1737, a German U15 member and QS-ranked in the mid-200s. Its
  programmable footprint is real but small, and it belongs almost entirely to the Göttingen State
  and University Library (SUB Göttingen) rather than to the university's central IT: two live
  OAI-PMH 2.0 harvesting endpoints on the university's own domains — the Göttinger
  Digitalisierungszentrum, harvesting back to 1998, and the eDiss dissertation server, which
  disseminates the German national xMetaDissPlus, epicur and picaxml profiles — plus a IIIF Image
  API 2.0 level-2 image service and IIIF Presentation manifests for the digitised collections. The
  university also operates its own SAML 2.0 identity provider, registered in DFN-AAI, exported to
  eduGAIN and Sirtfi-compliant, and holds the DataCite prefix 10.25625 as repository client
  SUBGOE.GRO. There is no central developer portal, no self-service API key, no published rate
  limits and no OpenAPI authored by the institution; every specification in this repository was
  written by API Evangelist from live probes and is marked as such. The GRO.data research-data
  repository and the SUB library catalogue are recorded here as relationships rather than as
  Göttingen contracts — GRO.data runs Dataverse and the catalogue resolves onto the GBV/VZG
  library platform.
