openapi: 3.0.3
info:
  title: GRO.data Dataverse REST Access saveAuxiliaryFileWithVersion API
  description: Native REST/search API for the GRO.data (Göttingen Research Online) Dataverse research-data repository operated by the Göttingen eResearch Alliance. Based on Dataverse 6.4.
  version: '6.4'
servers:
- url: https://data.goettingen-research-online.de/api
  description: GRO.data (Göttingen Research Online) Dataverse REST API
tags:
- name: saveAuxiliaryFileWithVersion
  description: Save Auxiliary File With Version
paths:
  /access/datafile/{fileId}/auxiliary/{formatTag}/{formatVersion}:
    post:
      tags:
      - saveAuxiliaryFileWithVersion
      summary: Save auxiliary file with version
      description: Saves an auxiliary file
      operationId: Access_saveAuxiliaryFileWithVersion
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      - name: formatTag
        in: path
        required: true
        schema:
          type: string
      - name: formatVersion
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
      responses:
        '200':
          description: File saved response
        '403':
          description: User not authorized to edit the dataset.
        '400':
          description: File not found based on id.
