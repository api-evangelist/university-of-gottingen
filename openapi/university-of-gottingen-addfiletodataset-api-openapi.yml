openapi: 3.0.3
info:
  title: GRO.data Dataverse REST Access addFileToDataset API
  description: Native REST/search API for the GRO.data (Göttingen Research Online) Dataverse research-data repository operated by the Göttingen eResearch Alliance. Based on Dataverse 6.4.
  version: '6.4'
servers:
- url: https://data.goettingen-research-online.de/api
  description: GRO.data (Göttingen Research Online) Dataverse REST API
tags:
- name: addFileToDataset
  description: Uploads a file for a dataset
paths:
  /datasets/{id}/add:
    post:
      tags:
      - addFileToDataset
      summary: Uploads a file for a dataset
      description: Uploads a file for a dataset
      operationId: Datasets_addFileToDataset
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
      responses:
        '200':
          description: File uploaded successfully to dataset
