  summary: 'Re-profiled under the university pipeline, with operator attribution settled before any contract
    was saved. Four institution-operated surfaces were verified live: the GDZ OAI-PMH repository (harvesting
    back to 1998), the eDiss dissertation OAI-PMH repository (oai_dc, xMetaDissPlus, epicur, picaxml),
    a IIIF Image API 2.0 level-2 image service with Presentation manifests, and the university''s own
    DFN-AAI/eduGAIN SAML identity provider. The June 2026 profile credited the university with 32 OpenAPI
    documents that were the Dataverse 6.4 REST contract split per tag and re-titled; those and everything
    derived from them were removed, and GRO.data is now recorded as one tenant relationship. The SUB library
    catalogue was found to be a CNAME onto the GBV/VZG platform and is recorded as tenant. Two SUB documentation
    pointers were graded live by status code while actually redirecting to the library homepage; both
    were replaced. The goettingen-research-online.de hosts now sit behind a proof-of-work bot challenge
    and answer 403 to programmatic clients, so the Dataverse REST and OAI surfaces are unreachable to
    a harvester — live but unreadable, not dead.'
